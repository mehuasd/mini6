
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b1a">
    <title>Log In | Renewal Radar</title>

    <style>
        :root {
            --bg: #070b1a;
            --panel: rgba(17, 25, 52, .88);
            --text: #f4f7ff;
            --muted: #a8b4d5;
            --cyan: #46d9f4;
            --purple: #9b7bff;
            --line: rgba(153, 177, 255, .18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(55, 95, 210, .24), transparent 35%),
                radial-gradient(ellipse at 85% 20%, rgba(135, 74, 238, .19), transparent 32%),
                var(--bg);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .auth-top {
            width: min(1160px, calc(100% - 40px));
            margin: auto;
            padding: 24px 0;
        }

        .brand {
            font-size: 1.3rem;
            font-weight: 850;
            letter-spacing: -.6px;
        }

        .brand span {
            color: var(--cyan);
        }

        .auth-wrap {
            min-height: calc(100vh - 88px);
            display: grid;
            place-items: center;
            padding: 28px 20px 60px;
        }

        .auth-card {
            width: min(460px, 100%);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 34px;
            background: var(--panel);
            box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
            backdrop-filter: blur(12px);
        }

        .eyebrow {
            display: inline-block;
            border: 1px solid rgba(70, 217, 244, .28);
            color: var(--cyan);
            background: rgba(70, 217, 244, .07);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: .82rem;
            font-weight: 750;
            letter-spacing: .4px;
        }

        h1 {
            font-size: 2.1rem;
            line-height: 1.2;
            letter-spacing: -1px;
            margin: 16px 0 12px;
        }

        .gradient {
            background: linear-gradient(100deg, var(--cyan), #a7b6ff 58%, #c39cff);
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
        }

        .auth-sub {
            color: var(--muted);
            line-height: 1.65;
            margin: 0 0 24px;
        }

        .field {
            display: block;
            margin: 18px 0;
        }

        .field span {
            display: block;
            font-size: .9rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 12px;
            outline: none;
            border: 1px solid var(--line);
            color: var(--text);
            background: rgba(4, 8, 20, .65);
            font-size: 1rem;
            transition: .2s ease;
        }

        .field input::placeholder {
            color: #7280a3;
        }

        .field input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(70, 217, 244, .1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 18px;
            border-radius: 12px;
            border: 1px solid var(--line);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            font-size: .95rem;
            background: rgba(255, 255, 255, .035);
            transition: .2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(70, 217, 244, .55);
        }

        .btn.primary {
            color: #07101f;
            border: 0;
            background: linear-gradient(110deg, var(--cyan), #8db9ff 55%, #b59aff);
            box-shadow: 0 10px 30px rgba(70, 217, 244, .12);
        }

        .btn.primary:hover {
            box-shadow: 0 12px 32px rgba(70, 217, 244, .22);
        }

        .full {
            width: 100%;
            margin-top: 10px;
        }

        .auth-switch {
            color: var(--muted);
            text-align: center;
            margin: 22px 0 0;
            font-size: .94rem;
        }

        .auth-switch a,
        .text-link {
            color: var(--cyan);
            font-weight: 750;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        .flash {
            padding: 12px 14px;
            border-radius: 12px;
            margin: 12px 0;
            font-size: .9rem;
            overflow-wrap: anywhere;
            display: none;
        }

        .flash.error {
            display: block;
            color: #ffc1cc;
            background: rgba(255, 80, 110, .1);
            border: 1px solid rgba(255, 80, 110, .2);
        }

        .flash.success {
            display: block;
            color: #b7ffe2;
            background: rgba(40, 220, 160, .1);
            border: 1px solid rgba(40, 220, 160, .2);
        }

        @media (max-width: 480px) {
            .auth-top {
                width: calc(100% - 28px);
            }

            .auth-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 1.85rem;
            }
        }
    </style>
</head>

<body>
    <header class="auth-top">
        <a class="brand" href="landing.html">
            Renewal<span>Radar</span>
        </a>
    </header>

    <main class="auth-wrap">
        <section class="auth-card">
            <span class="eyebrow">WELCOME BACK</span>

            <h1>Log in to your <span class="gradient">account.</span></h1>

            <p class="auth-sub">
                Pick up right where you left off and check your upcoming renewals.
            </p>

            <div id="message" class="flash" role="alert" aria-live="polite"></div>

            <form id="loginForm">
                <label class="field">
                    <span>Email address</span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </label>

                <label class="field">
                    <span>Password</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </label>

                <button class="btn primary full" type="submit">
                    Log In →
                </button>
            </form>

            <p class="auth-switch">
                New to Renewal Radar?
                <a href="signup.html">Create an account</a>
            </p>

            <p class="auth-switch">
                <a href="landing.html">← Back to home</a>
            </p>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "flash " + type;
        }

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email")
                .value.trim().toLowerCase();

            const password = document.getElementById("password").value;

            let users = [];

            try {
                users = JSON.parse(localStorage.getItem("rr_users")) || [];
            } catch (error) {
                users = [];
            }

            const user = users.find(function (account) {
                return account.email.toLowerCase() === email &&
                    account.password === password;
            });

            if (!user) {
                showMessage(
                    "Invalid email or password. Please check your details or create an account.",
                    "error"
                );
                return;
            }

            // Store the current demo session.
            localStorage.setItem("rr_current_user", JSON.stringify({
                name: user.name,
                email: user.email
            }));

            showMessage("Login successful! Opening your dashboard...", "success");

            window.location.href = "dashboard.html";
        });
    </script>
<script src="rr-app.js"></script>
</body>
</html>
