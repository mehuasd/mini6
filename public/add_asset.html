<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renewal Radar — Add Asset & Vault Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.65) 0%, rgba(15, 23, 42, 0.85) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #070b14; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    </style>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen relative overflow-x-hidden antialiased flex items-center justify-center p-4">

    <div class="fixed top-[-10%] left-[20%] w-[500px] h-[500px] bg-sky-600/15 rounded-full blur-[130px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[15%] w-[600px] h-[600px] bg-indigo-600/15 rounded-full blur-[150px] pointer-events-none z-0"></div>

    <div class="relative z-10 w-full max-w-xl">
        <div class="mb-4">
            <a href="#" onclick="alert('Returning to Dashboard')" class="text-xs font-semibold text-slate-400 hover:text-sky-400 transition-colors inline-flex items-center space-x-1.5">
                <span>← Back to Dashboard Overview</span>
            </a>
        </div>

        <div class="glass-card rounded-3xl p-8 shadow-2xl relative">
            <div class="flex items-center justify-between pb-5 border-b border-white/10 mb-6">
                <div class="flex items-center space-x-3.5">
                    <div class="w-10 h-10 rounded-2xl bg-sky-500/20 border border-sky-500/30 flex items-center justify-center text-sky-400 text-lg shadow-inner">
                        🛡️
                    </div>
                    <div>
                        <h2 class="text-xl font-extrabold text-white tracking-tight">Register New Asset</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Input renewal parameters & upload vault proofs</p>
                    </div>
                </div>
                <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-white/5 text-slate-300 border border-white/10 uppercase tracking-wider">
                    Vault Secure
                </span>
            </div>

            <form onsubmit="event.preventDefault(); alert('Asset successfully registered and saved to vault!');" class="space-y-4 text-xs">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">Asset Name / Service</label>
                        <input type="text" required placeholder="e.g., Star Health Insurance / Netflix" class="w-full bg-slate-950/70 border border-white/15 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all text-xs">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">Domain Category</label>
                        <select class="w-full bg-slate-950/70 border border-white/15 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition-all text-xs">
                            <option>Subscription (OTT / SaaS)</option>
                            <option selected>Insurance Policy</option>
                            <option>Product Warranty</option>
                            <option>Civic ID / Document</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">Recurring Cost (₹)</label>
                        <input type="number" required placeholder="3333" class="w-full bg-slate-950/70 border border-white/15 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all text-xs">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">Billing Frequency</label>
                        <select class="w-full bg-slate-950/70 border border-white/15 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition-all text-xs">
                            <option>Monthly</option>
                            <option>Quarterly</option>
                            <option selected>Annual</option>
                            <option>One-Time / Multi-Year</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">Expiration Date</label>
                        <input type="date" required value="2026-10-29" class="w-full bg-slate-950/70 border border-white/15 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition-all text-xs">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">Custom Portal URL (Optional)</label>
                        <input type="url" placeholder="https://provider.com/renew" class="w-full bg-slate-950/70 border border-white/15 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all text-xs">
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">Attach Supporting Vault Proof (PDF / Scans)</label>
                    <div class="border-2 border-dashed border-white/20 rounded-2xl p-6 text-center hover:border-sky-500/60 transition-all bg-slate-950/40 cursor-pointer group">
                        <span class="text-3xl block mb-1 group-hover:scale-110 transition-transform">📂</span>
                        <span class="font-bold text-slate-200">Drag & drop files here, or <span class="text-sky-400 underline">browse storage</span></span>
                        <p class="text-[10px] text-slate-400 mt-1">Supports PDF, PNG, JPG · Stored in encrypted local/cloud vault</p>
                    </div>
                </div>

                <div class="pt-5 border-t border-white/10 flex items-center justify-between">
                    <span class="text-[11px] text-slate-400">Renewal Radar Asset Manager</span>
                    <div class="flex space-x-3">
                        <button type="button" onclick="alert('Cancelled action')" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-white/5 text-slate-300 hover:bg-white/10 border border-white/10 transition-all">
                            Cancel
                        </button>
                        <button type="submit" class="px-6 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow-lg shadow-sky-500/25 hover:scale-[1.02] active:scale-[0.98] transition-all">
                            Save Asset & Verify →
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
<script src="rr-app.js"></script>
</body>
</html>
